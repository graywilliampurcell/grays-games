name: Build Mazle Playtest

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/playtest/**'
      - '.github/workflows/build-playtest.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./src/playtest
      run: npm install

    - name: Build
      working-directory: ./src/playtest
      run: npm run build

    - name: Upload dist as artifact
      uses: actions/upload-artifact@v3
      with:
        name: mazle-playtest-dist
        path: src/playtest/dist/
        retention-days: 30

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./src/playtest/dist
        destination_dir: mazle-playtest
